name: TriggerHappy - Discussion Moderation Tool # TODO find a better name
description: >
  GitHub Discussion Moderation Tool

inputs:
  github_token:
    description: GitHub token with discussions:write and contents:write
    required: true
  storage_repo:
    description: >
      owner/repo to store config.yml, banned.yml, strikes.yml in.
      Defaults to the repo running the workflow. Point this at a
      separate repo (e.g. your org's .github repo) to keep the write
      commits out of the moderated repo's history.
    required: false
  config_path:
    description: Path to config.yml (role lists) in the consumer repo
    required: false
    default: .github/discussion_moderator/config.yml
  banned_path:
    description: Path to banned.yml in the consumer repo
    required: false
    default: .github/discussion_moderator/banned.yml
  strikes_to_ban:
    description: Number of strikes a user can receive before being auto-banned. Set this if you want to enable strikes feature.
    required: false
  strikes_path:
    description: Path to strikes.yml in the consumer repo. Optional
    required: false
    default: .github/discussion_moderator/strikes.yml
  auto_close_regex:
    description: Regex to match against when enforcing format. Provide one to enable this feature.
    required: false
  auto_close_categories:
    description: Categories of discussions to enfore format in.
    required: false
  strike_per_nonFormat:
    description: Should discussion authors who didn't obey the format also receive a strike.
    required: false
    default: False 

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Run moderation
      shell: bash
      run: python "${{ github.action_path }}/src/moderate.py"
      env:
        github_token:          ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }} # if CROSS_REPO_TOKEN is set, it is assumed user wants to use cross-repo mode
        STORAGE_REPO:          ${{ inputs.storage_repo }}
        DISCUSSION_NODE_ID:    ${{ github.event.discussion.node_id }}
        DISCUSSION_AUTHOR:     ${{ github.event.discussion.user.login }}
        COMMENT_BODY:          ${{ github.event.comment.body }}
        DISCUSSION_BODY:       ${{ github.event.discussion.body }}
        DISCUSSION_CATEGORY:   ${{ github.event.discussion.category.name }}
        CONFIG_PATH:           ${{ inputs.config_path }}
        BANNED_PATH:           ${{ inputs.banned_path }}
        STRIKES_PATH:          ${{ inputs.strikes_path }}
        STRIKES_TO_BAN:        ${{ inputs.strikes_to_ban }}
        AUTO_CLOSE_REGEX:      ${{ inputs.auto_close_regex }}
        AUTO_CLOSE_CATEGORIES: ${{ inputs.auto_close_categories }}
        STRIKE_PER_NONFORMAT:  ${{ inputs.strike_per_nonFormat }}
        # GITHUB_REPOSITORY, GITHUB_ACTOR, GITHUB_EVENT_NAME are set automatically